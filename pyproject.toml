[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# BLE001/S110/S112: una captura genérica de Exception registra con contexto, o
# se elimina para que suba al handler global de app/api/app.py. Cuando el ancho
# es deliberado (bucles que no deben pararse, redes de seguridad de un stream ya
# iniciado, el propio logger) se marca con `# noqa: BLE001` y el motivo al lado.
select = ["E4", "E7", "E9", "F", "I", "BLE001", "S110", "S112"]
