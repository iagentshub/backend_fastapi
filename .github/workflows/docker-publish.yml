name: Build & Push Docker image

permissions:
  contents: read
  packages: write

on:
  # Publicar solo el SHA exacto que acaba de superar CI. Un `push` paralelo
  # permitia publicar una imagen aunque pytest terminara en rojo.
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generar version de build
        id: version
        run: echo "value=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/iagentshub/backend
          tags: |
            type=raw,value=latest
            type=raw,value=fastapi
            type=raw,value=fastapi-${{ steps.version.outputs.value }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GAIA_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # El GITHUB_TOKEN de este repo no puede disparar workflows en iAgents, y
      # su cron "horario" GitHub lo atrasa de 3 a 7 h: un cambio que solo
      # tocara este repo tardaba media tarde en llegar a la imagen desplegada.
      # Sin secreto es una instalación que no participa en el aviso: anotación y
      # seguir. Con secreto y respuesta 401/403 el paso falla, porque es una
      # avería de la cadena de entrega —token caducado o sin permisos— y hoy se
      # veía igual que no tenerlo: el mismo warning amarillo dentro de un job
      # verde, que nadie mira. El de app_flutter llevaba meses dando 403 en cada
      # push sin que constara en ninguna parte. El cron sigue de respaldo.
      - name: Avisar a iAgents para reconstruir la imagen unificada
        env:
          GH_TOKEN: ${{ secrets.IAGENTS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Sin IAGENTS_DISPATCH_TOKEN: la imagen esperará al cron."
            exit 0
          fi
          if ! salida=$(gh api -X POST repos/iagentshub/iAgents/dispatches \
              -f event_type=upstream-push --silent 2>&1); then
            echo "::error::El aviso a iAgents falló con el token configurado: $salida"
            exit 1
          fi
