name: Pagination PostgreSQL benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/pagination/**"
      - "app/services/resource_visibility.py"
      - "app/sql/**"
      - "app/storage/**"
      - "tests/performance/test_pagination_postgres.py"
      - "tests/postgres/cursor_endpoints_postgres.py"
      - ".github/workflows/pagination-postgres.yml"

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pagination
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pagination"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GAIA_TEST_PG_DSN: postgresql://postgres:test@127.0.0.1:5432/pagination
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock
      - name: Run PostgreSQL cursor benchmark
        run: python -m pytest -q -s tests/performance/test_pagination_postgres.py
      - name: Run PostgreSQL cursor endpoint smoke
        run: python tests/postgres/cursor_endpoints_postgres.py
